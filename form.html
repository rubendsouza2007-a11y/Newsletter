<!DOCTYPE html>
<html>
<head>

    <title>THE TIMES OF INDIA</title>

</head>
<body style="background-color: rgb(230, 173, 173);"> 

    <h1 style="text-align: center; color: rgb(200, 30, 170);">This is a Form</h1>

    <form action="apply.js" method="get">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="alphabetsdigits@gmail.com" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="123-456-7890"><br><br>
        <label for="gender">Gender: </label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
            <option value="australia">Australia</option>
        </select><br><br>
        <label for="checkbox">Subscribe to newsletter:</label>
        <input type="checkbox" id="checkbox" name="checkbox"><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

</body>


</html>
